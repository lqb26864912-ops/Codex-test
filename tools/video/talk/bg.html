<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/package/700.css"><link rel="stylesheet" href="fonts/package/900.css">
<style>*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#121212;font-family:"Noto Sans SC",sans-serif;color:#fff}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:90px 90px}

.wm{position:absolute;right:-90px;top:-40px;width:520px;opacity:.06;filter:grayscale(1)}

.foot{position:absolute;left:0;right:0;top:1620px;display:flex;flex-direction:column;align-items:center;gap:14px}

.foot b{font-size:54px;font-weight:900;letter-spacing:2px}
.foot .en{font-size:26px;font-weight:700;color:rgba(255,255,255,.6);letter-spacing:1px}

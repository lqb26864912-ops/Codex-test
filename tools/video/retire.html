<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts/package/400.css">
<link rel="stylesheet" href="fonts/package/700.css">
<link rel="stylesheet" href="fonts/package/900.css">
<style>
  :root{--bg:#121212;--fg:#f5f5f5;--muted:rgba(255,255,255,.74);--dim:rgba(255,255,255,.58);--peach:#ffc49b;--peach2:#ffe6cf;--amber:#ff9d5c;--ease:cubic-bezier(.2,.7,.2,1)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);color:var(--fg);font-family:"Noto Sans SC",sans-serif}
  .bg{position:absolute;inset:0;overflow:hidden}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:90px 90px;mask-image:radial-gradient(circle at 50% 45%,#000 0%,transparent 70%)}
  .glowA{position:absolute;width:1100px;height:1100px;left:-300px;top:120px;border-radius:50%;background:radial-gradient(circle,rgba(255,157,92,.22),transparent 65%);animation:drift 15s linear both}
  .glowB{position:absolute;width:900px;height:900px;right:-320px;top:900px;border-radius:50%;background:radial-gradient(circle,rgba(219,230,255,.12),transparent 65%);animation:drift2 15s linear both}
  @keyframes drift{from{transform:translate(0,0)}to{transform:translate(160px,120px)}}
  @keyframes drift2{from{transform:translate(0,0)}to{transform:translate(-140px,-160px)}}

  .scene{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 90px}
  .glow{background:linear-gradient(180deg,#fff 0%,var(--peach2) 45%,var(--peach) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .in{animation:up .7s var(--ease) both}
  @keyframes up{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
  @keyframes out{from{opacity:1}to{opacity:0;transform:translateY(-36px)}}
  @keyframes pop{0%{opacity:0;transform:scale(.7)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
  @keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,196,155,.45)}50%{transform:scale(1.05);box-shadow:0 0 0 22px rgba(255,196,155,0)}}

  /* scene 1: 0 – 3.2 s */
  #s1{animation:out .35s 2.85s both}
  #s1 .h{font-size:118px;font-weight:900;line-height:1.18;letter-spacing:-1px}
  #s1 .sub{margin-top:46px;font-size:58px;font-weight:700;color:var(--muted)}

  /* scene 2: 3.2 – 8.0 s */
  #s2{animation:out .35s 7.65s both}
  .badge{display:inline-flex;align-items:center;gap:16px;padding:14px 30px;border:2px solid rgba(255,196,155,.7);border-radius:999px;font-size:30px;font-weight:700;letter-spacing:4px;color:var(--peach2)}
  .dot{width:14px;height:14px;border-radius:50%;background:var(--amber);box-shadow:0 0 16px var(--amber)}
  #s2 .title{margin-top:40px;font-size:200px;font-weight:900;line-height:1.05}
  #s2 .kind{margin-top:18px;font-size:60px;font-weight:700;color:var(--muted)}
  .stat{margin-top:70px;padding:34px 56px;border-radius:32px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14)}
  .stat .lab{font-size:40px;color:var(--dim);font-weight:700}
  .stat .num{font-size:128px;font-weight:900;line-height:1.1}
  #s2 .price{margin-top:56px;font-size:66px;font-weight:900}
  #s2 .price b{color:var(--peach)}
  .note{margin-top:30px;font-size:31px;color:var(--dim);font-weight:400;line-height:1.5}

  /* scene 3: 8.0 – 12.0 s */
  #s3{animation:out .35s 11.65s both}
  #s3 .h{font-size:120px;font-weight:900;line-height:1.15}
  .pills{margin-top:64px;display:flex;flex-direction:column;gap:22px;width:760px}
  .pill{display:flex;justify-content:space-between;align-items:center;padding:26px 44px;border-radius:26px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);font-size:54px;font-weight:900}
  .pill span:last-child{font-size:44px;font-weight:700;color:var(--peach)}
  #s3 .sub{margin-top:48px;font-size:46px;font-weight:700;color:var(--muted)}

  /* scene 4: 12.0 – 15.0 s */
  .logo{width:230px;height:230px;border-radius:48px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .7s var(--ease) both}
  .brand{margin-top:42px;font-size:50px;font-weight:900;letter-spacing:.5px}
  .tag{margin-top:18px;font-size:56px;font-weight:700;color:var(--peach)}
  .cta{margin-top:70px;display:inline-block;padding:34px 84px;border-radius:999px;background:#fff;color:#111;font-size:64px;font-weight:900;animation:up .7s var(--ease) both, pulse 1.4s ease-in-out 13.6s infinite}
  .disc{margin-top:44px;font-size:34px;color:var(--dim)}

  /* --- retirement-specific --- */
  #s1 .small{margin-top:36px;font-size:40px;font-weight:700;color:var(--dim)}
  .cards{display:flex;flex-direction:column;gap:34px;width:900px}
  .card{text-align:left;padding:40px 52px;border-radius:32px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.16)}
  .card.fast{border-color:rgba(255,196,155,.6);background:rgba(255,157,92,.08)}
  .card .tt{font-size:48px;font-weight:900;color:var(--muted)}
  .card.fast .tt{color:var(--peach2)}
  .card .pp{margin-top:6px;font-size:104px;font-weight:900;line-height:1.1}
  .card .pp small{font-size:46px;font-weight:700;margin-left:12px;color:var(--muted)}
  .card .dd{margin-top:10px;font-size:42px;font-weight:700;color:var(--muted)}
  #s2 .h2{font-size:64px;font-weight:900;margin-bottom:44px}
  .checks{margin-top:56px;display:flex;flex-direction:column;gap:26px;width:820px}
  .check{display:flex;align-items:center;gap:30px;padding:30px 44px;border-radius:28px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);font-size:58px;font-weight:900;text-align:left}
  .tick{flex:none;width:72px;height:72px;border-radius:50%;background:var(--peach);color:#1a1a1a;display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:900}
  .warn{margin-top:60px;width:860px;padding:30px 40px;border-radius:24px;border:2px solid rgba(255,196,155,.55);font-size:44px;font-weight:700;line-height:1.45;color:var(--peach2)}
</style>
</head>
<body>
<div class="bg"><div class="grid"></div><div class="glowA"></div><div class="glowB"></div></div>

<section class="scene" id="s1">
  <div class="h in glow" style="animation-delay:.15s">泰国养老签</div>
  <div class="h in" style="animation-delay:.5s">首次办理</div>
  <div class="sub in" style="animation-delay:1.1s">有两条通道</div>
  <div class="small in" style="animation-delay:1.6s">通常 50 岁以上可申请</div>
</section>

<section class="scene" id="s2">
  <div class="h2 in" style="animation-delay:3.3s">两条通道怎么选？</div>
  <div class="cards">
    <div class="card in" style="animation-delay:3.7s">
      <div class="tt">普通通道</div>
      <div class="pp">54,000<small>泰铢</small></div>
      <div class="dd">通常 3–5 天 · 本人到场约 2 次</div>
    </div>
    <div class="card fast in" style="animation-delay:4.8s">
      <div class="tt">加急通道</div>
      <div class="pp glow">60,000<small>泰铢</small></div>
      <div class="dd">符合条件，最快当天出签</div>
    </div>
  </div>
</section>

<section class="scene" id="s3">
  <div class="h2 in" style="animation-delay:8.1s;font-size:64px;font-weight:900">一次办下来</div>
  <div class="stat in" style="animation-delay:8.4s;margin-top:30px"><div class="lab">常见可获批最长</div><div class="num glow">15 个月</div></div>
  <div class="note in" style="animation-delay:8.9s;margin-top:22px;font-size:34px">以移民局实际批准为准</div>
  <div class="check in" style="animation-delay:9.5s;margin-top:50px;width:880px"><span class="tick">✓</span><span><span style="display:block;font-size:34px;font-weight:700;color:rgba(255,255,255,.6)">价格包含</span><span style="white-space:nowrap;font-size:50px">协助开银行账户 + 1 年延期</span></span></div>
  <div class="warn in" style="animation-delay:10.2s;margin-top:40px">资金须为本人的真实存款或收入</div>
</section>

<section class="scene" id="s4">
  <img class="logo" src="logo.png" style="animation-delay:12.1s" alt="">
  <div class="brand in" style="animation-delay:12.45s">The magnificent world VISA</div>
  <div class="tag in" style="animation-delay:12.7s">曼谷注册 · 中文咨询</div>
  <div class="cta" style="animation-delay:13.0s, 13.6s">点击了解 ↗</div>
  <div class="disc in" style="animation-delay:13.4s">以移民局为准 · 不保证获批</div>
</section>
</body>
</html>

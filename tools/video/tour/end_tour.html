<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/package/400.css"><link rel="stylesheet" href="fonts/package/700.css"><link rel="stylesheet" href="fonts/package/900.css">
<style>
:root{--peach:#ffc49b;--peach2:#ffe6cf;--ease:cubic-bezier(.2,.7,.2,1)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#121212;color:#fff;font-family:"Noto Sans SC",sans-serif}
.bgimg{position:absolute;inset:0;background:url(photo.jpg) center/cover;filter:blur(30px) brightness(.35);transform:scale(1.1)}
.s{position:absolute;left:70px;width:830px;top:220px;height:1340px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.glow{background:linear-gradient(180deg,#fff 0%,var(--peach2) 45%,var(--peach) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes up{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.7)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,196,155,.45)}50%{transform:scale(1.05);box-shadow:0 0 0 22px rgba(255,196,155,0)}}
.in{animation:up .5s var(--ease) both}
.logo{width:170px;height:170px;border-radius:38px;animation:pop .6s var(--ease) both}
.h{margin-top:40px;font-size:74px;font-weight:900;line-height:1.25}
.pills{margin-top:40px;display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.pills span{padding:14px 30px;border-radius:999px;border:2px solid rgba(255,196,155,.8);font-size:42px;font-weight:900;color:var(--peach2)}
.cta{margin-top:50px;padding:28px 70px;border-radius:999px;background:#fff;color:#111;font-size:56px;font-weight:900;animation:up .5s var(--ease) .9s both,pulse 1.4s ease-in-out 1.5s infinite}
.d{margin-top:30px;font-size:30px;color:rgba(255,255,255,.6)}
</style></head><body><div class="bgimg"></div>
<div class="s"><img class="logo" src="logo.png" alt="">
<div class="h in" style="animation-delay:.2s">想在泰国长住？<br><span class="glow">先把签证安排好</span></div>
<div class="pills"><span class="in" style="animation-delay:.45s">养老签</span><span class="in" style="animation-delay:.6s">精英签</span><span class="in" style="animation-delay:.75s">DTV</span></div>
<div class="cta">有问题，私信我们</div>
<div class="d in" style="animation-delay:1.1s">曼谷注册 · 中文咨询</div></div>
<script>window.DURATION=3.5;</script></body></html>
